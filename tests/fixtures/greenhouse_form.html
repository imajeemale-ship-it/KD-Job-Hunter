<!doctype html><html lang="en"><head><title>Example Greenhouse application</title></head><body>
<main><h1>Software Engineer — Example Company</h1><form id="application-form" action="#" method="post" enctype="multipart/form-data">
<label for="first_name">First Name</label><input id="first_name" name="first_name" autocomplete="given-name" required>
<label for="last_name">Last Name</label><input id="last_name" name="last_name" autocomplete="family-name" required>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="phone">Phone</label><input id="phone" name="phone" type="tel">
<label for="resume">Resume</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" required>
<label for="linkedin">LinkedIn URL</label><input id="linkedin" name="linkedin" type="url">
<label for="cover_letter">Cover Letter</label><textarea id="cover_letter" name="cover_letter"></textarea>
<button type="submit">Submit Application</button>
</form></main></body></html>
