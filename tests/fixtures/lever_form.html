<!doctype html><html lang="en"><head><title>Example Lever application</title></head><body>
<main><h1>Backend Engineer — Example Company</h1><form id="application" action="#" method="post" enctype="multipart/form-data">
<label for="name">Full Name</label><input id="name" name="name" autocomplete="name" required>
<label for="email">Email</label><input id="email" name="email" type="email" required>
<label for="phone">Phone</label><input id="phone" name="phone" type="tel">
<label for="resume">Resume</label><input id="resume" name="resume" type="file" accept=".pdf,.doc,.docx" required>
<label for="linkedin">LinkedIn URL</label><input id="linkedin" name="linkedin" type="url">
<label for="additional">Additional Information</label><textarea id="additional" name="additional"></textarea>
<button type="submit">Submit Application</button>
</form></main></body></html>
